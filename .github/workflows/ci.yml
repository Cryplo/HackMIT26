name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest
      - run: node --check jev_ultrafast/snapshot.js
      - run: node --check jev_ultrafast/snake_board.js
      - run: node --check jev_ultrafast/static/app.js
      - run: uv build
      - run: npm ci --prefix extension
      - run: npm run build --prefix extension
      - run: npm test --prefix extension
      - run: npx playwright install --with-deps chromium
        working-directory: extension
      - run: npm run test:browser
        working-directory: extension
