<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes · Workshop registration</title><style>body{font:17px/1.6 system-ui;background:#f5f3e9;color:#183d30;margin:0}main{max-width:680px;margin:40px auto;padding:30px}h1{font:48px Georgia}label{display:block;margin-top:20px}input,select,textarea{font:inherit;padding:10px;width:100%;box-sizing:border-box}button{font:inherit;padding:12px 22px;background:#194d39;color:white;border:0;border-radius:4px;margin:20px 12px 0 0}input[type=checkbox]{width:auto}#result{padding:20px;background:#deebdb;margin-top:20px}small{color:#536559}a{color:inherit}</style></head><body><main><small>FIELDNOTES / COMMUNITY WORKSHOPS</small><h1>A place to learn.<br>A space to belong.</h1><p>Practice voice navigation with this local registration form. Nothing is sent anywhere when you submit.</p><form id="registration"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"><label for="workshop">Workshop</label><select id="workshop"><option value="art">Watercolor basics</option><option value="code">Creative coding</option><option value="garden">Urban gardening</option></select><label for="notes">Accessibility requests (optional)</label><textarea id="notes" rows="3"></textarea><label><input id="updates" type="checkbox">Send me workshop updates</label><button type="submit">Register for workshop</button><button type="button" id="replace">Replace name field (test stale targets)</button></form><section id="result" role="status" hidden></section><p><a href="https://example.com">Visit an example public page</a></p></main><script>let submissions=0;document.querySelector('form').onsubmit=e=>{e.preventDefault();submissions++;let r=document.querySelector('#result');r.hidden=false;r.textContent='Registration complete. Local submissions: '+submissions;};document.querySelector('#replace').onclick=()=>{let n=document.querySelector('#name');n.replaceWith(n.cloneNode(true));};</script></body></html>
