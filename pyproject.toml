[project]
name = "hackmit26"
version = "0.1.0"
description = "HackMIT 26: Jev decisions with Browser Use browser automation"
readme = "README.md"
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "fastapi>=0.115,<1",
    "httpx[http2]>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
hackmit = "hackmit26.cli:main"
jev = "jev_ultrafast.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackmit26", "jev_ultrafast"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
